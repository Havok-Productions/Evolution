# Facts are sent automatically according to this schedule.
schedule:
  enabled: true
  initial-delay-seconds: 60
  # Use a positive number for a fixed interval, or -1 for a random interval.
  interval-seconds: 300
  random-interval-min-seconds: 60
  random-interval-max-seconds: 600
  # Skip scheduled announcements while nobody is online.
  require-online-players: true

# Optionally send a fact to a player shortly after they join.
on-join:
  enabled: false
  delay-seconds: 5

# RANDOM avoids repeating the same fact twice in a row.
# SEQUENTIAL walks through the list in order and then starts over.
order: RANDOM

# RANDOM chooses a new readable color for every message. You can also use a
# fixed color such as GOLD, AQUA, GREEN, YELLOW, RED, BLUE, or LIGHT_PURPLE.
message-color: RANDOM

# MiniMessage formatting is supported. <fact> is replaced with the selected
# fact as plain text, so facts containing "<" or ">" are displayed safely.
message-format: "<bold>Fun Fact:</bold> <fact>"

messages:
  reloaded: "<green>FoliaFunFacts configuration reloaded.</green>"
  sent: "<green>Sent a fun fact.</green>"
  no-facts: "<red>No fun facts are configured.</red>"
  no-permission: "<red>You do not have permission to do that.</red>"
  usage: "<yellow>Usage: /funfacts &lt;now|reload|list&gt;</yellow>"
  list-header: "<gold>Configured fun facts (<count>):</gold>"
  list-entry: "<gray><number>.</gray> <white><fact></white>"

facts:
  - "Honey never spoils. Archaeologists have found edible honey in ancient Egyptian tombs."
  - "Octopuses have three hearts."
  - "A group of flamingos is called a flamboyance."
  - "Bananas are berries, but strawberries are not."
  - "The Eiffel Tower can grow about 15 cm taller during hot weather."
