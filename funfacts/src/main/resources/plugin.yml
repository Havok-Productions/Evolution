name: FoliaFunFacts
version: '1.0.0'
main: com.example.foliafunfacts.FoliaFunFactsPlugin
api-version: '26.1.2'
folia-supported: true
description: Configurable fun-fact announcements for Folia and Paper.
author: yomamaeatstoes

commands:
  funfacts:
    description: Manage fun-fact announcements.
    usage: /funfacts <now|reload|list>
    aliases: [funfact, facts]
    permission: funfacts.use

permissions:
  funfacts.use:
    description: Allows use of the base funfacts command.
    default: op
  funfacts.now:
    description: Allows sending a fun fact immediately.
    default: op
  funfacts.reload:
    description: Allows reloading the fun-facts configuration.
    default: op
  funfacts.list:
    description: Allows listing configured fun facts.
    default: op
