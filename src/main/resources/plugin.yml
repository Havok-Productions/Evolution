name: Evolution
version: ${project.version}
main: org.evolution.coreparts.EvolutionPlugin
api-version: '26.1.2'
folia-supported: true
softdepend: [WorldGuard]
description: Folia-safe natural world evolution, regrowth, wind, puddles, waves, ecology, and Nether corruption.
commands:
  evolution:
    description: Manage Evolution.
    usage: /evolution <reload|status|pending|tree>
    permission: evolution.admin
permissions:
  evolution.admin:
    description: Allows Evolution administration commands.
    default: op
