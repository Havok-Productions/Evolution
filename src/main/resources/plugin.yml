name: SlowTrees
version: ${project.version}
main: org.slowtrees.core.SlowTreesPlugin
api-version: '26.1.2'
folia-supported: true
description: Folia-safe natural regrowth and Nether portal corruption.
commands:
  slowtrees:
    description: Manage SlowTrees.
    usage: /slowtrees <reload|status|pending|tree>
    permission: slowtrees.admin
permissions:
  slowtrees.admin:
    description: Allows SlowTrees administration commands.
    default: op
