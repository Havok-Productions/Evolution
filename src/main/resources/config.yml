# Default: 1 second at 20 TPS.
initial-delay-ticks: 20

# Once regrowth begins, this controls how quickly blocks appear.
# Default: 1 block every 30 seconds at 20 TPS.
growth-step-ticks: 600
blocks-per-growth-step: 1

# World health mode slows natural regrowth without changing the normal baseline.
# A growth-speed-multiplier of 0.15 means 15% normal speed.
# With the defaults above, enabled mode grows about 1 block every 200 seconds.
world-health-mode:
  enabled: true
  growth-speed-multiplier: 0.15

# If a tree cannot regrow because the area is unloaded, too far from players,
# or blocked by another region boundary, it retries later without loading chunks.
retry-delay-ticks: 6000

# 0 means retry forever. Positive values remove the queued tree after that many attempts.
max-regrowth-attempts: 0

# When a lowest trunk/stem anchor is cut, the disconnected natural plant above it
# can decay instead of hanging forever. Default delay: 5 minutes at 20 TPS.
plant-decay:
  enabled: true
  delay-ticks: 6000
  step-ticks: 20
  blocks-per-step: 1
  max-blocks: 128

# Require an online player within this many chunks of the tree base.
# Set to 0 to disable this distance check.
required-player-distance-chunks: 8

# Tree generation can touch neighboring chunks. Keep this at 1 unless you notice
# Folia ownership warnings with large trees.
owned-chunk-radius: 1

# Empty enabled-worlds means all worlds except disabled-worlds are allowed.
enabled-worlds: []
disabled-worlds: []

# Writes a high-level trace of how the plugin moves through its own decision
# paths. Use this when a feature is "doing something" but the why is unclear.
architecture-pathfinding:
  debug:
    enabled: true
    recent-events: 160
    save-interval-millis: 10000

# Materials that slow regrowth may replace. Solid player blocks are intentionally
# not listed, so queued trees wait instead of eating builds.
replaceable-materials:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - SHORT_GRASS
  - TALL_GRASS
  - FERN
  - LARGE_FERN
  - VINE
  - SNOW

# Log material to Bukkit TreeType mapping. Missing materials or TreeTypes are
# ignored at runtime, which keeps the config friendlier across versions.
tree-types:
  OAK_LOG: TREE
  BIRCH_LOG: BIRCH
  SPRUCE_LOG: REDWOOD
  JUNGLE_LOG: SMALL_JUNGLE
  ACACIA_LOG: ACACIA
  DARK_OAK_LOG: DARK_OAK
  MANGROVE_LOG: MANGROVE
  CHERRY_LOG: CHERRY
  PALE_OAK_LOG: PALE_OAK

# Huge mushroom cap material to Bukkit TreeType mapping. Stems are detected
# automatically by nearby red or brown cap blocks.
mushroom-types:
  RED_MUSHROOM_BLOCK: RED_MUSHROOM
  BROWN_MUSHROOM_BLOCK: BROWN_MUSHROOM

# Meadow growth lets natural surface life slowly spread outward. Dirt near
# existing grass can become grass, grass can grow low/tall plants, and flowers
# appear in small biome-aware clusters. It only touches natural surface blocks,
# loaded chunks, current Folia regions, and nearby-player areas.
meadow-growth:
  enabled: true
  step-ticks: 60
  search-radius: 18
  attempts-per-step: 32
  blocks-per-step: 2
  required-player-distance-chunks: 6
  grass-spread-chance-percent: 75
  plant-grow-chance-percent: 50
  flower-chance-percent: 16
  height-growth-chance-percent: 35
  max-plants-per-area: 48
  replace-leaf-litter: true

# Nether corruption treats active Nether portals in the Overworld as sources
# of slow terrain change. It does not use a configurable replacement map:
# only internal vanilla-inspired natural block mimics are applied, and blocks
# without a clear Nether equivalent are left alone.
nether-corruption:
  enabled: true
  spread-step-ticks: 200
  blocks-per-step: 1
  max-radius: 100
  vertical-radius: 8
  attempts-per-step: 96
  required-player-distance-chunks: 8
  player-portal-scan-radius: 32
  testing:
    enabled: true
    spread-step-ticks: 40
    blocks-per-step: 4
  branching:
    enabled: true
    branch-chance-percent: 85
    branch-radius: 4
    max-frontier-size: 512
  debug:
    recent-events: 40
    map-radius: 24

# Wind is mostly visible through leaves. It spawns subtle falling-leaf motion near
# tree canopies and rarely lets leaves settle into natural, surface-only litter.
wind:
  enabled: true
  gust-tick-interval: 10
  pattern-change-ticks: 6000
  tree-search-radius: 18
  required-player-distance-chunks: 6
  weather:
    clear-drift-radius: 10
    rain-drift-radius: 4
    storm-drift-radius: 16
  leaf-litter:
    placement-step-ticks: 300
    placement-attempts: 32
    max-per-chunk: 16
  debug:
    recent-events: 40
