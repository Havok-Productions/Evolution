# Default: 1 second at 20 TPS.
initial-delay-ticks: 20

# Once regrowth begins, this controls how quickly blocks appear.
# Default: 1 block every 30 seconds at 20 TPS.
growth-step-ticks: 600
blocks-per-growth-step: 1

# World health mode slows natural regrowth without changing the normal baseline.
# A growth-speed-multiplier of 0.15 means 15% normal speed.
# With the defaults above, enabled mode grows about 1 block every 200 seconds.
world-health-mode:
  enabled: true
  growth-speed-multiplier: 0.15

# If a tree cannot regrow because the area is unloaded, too far from players,
# or blocked by another region boundary, it retries later without loading chunks.
retry-delay-ticks: 6000

# 0 means retry forever. Positive values remove the queued tree after that many attempts.
max-regrowth-attempts: 0

# Require an online player within this many chunks of the tree base.
# Set to 0 to disable this distance check.
required-player-distance-chunks: 8

# Tree generation can touch neighboring chunks. Keep this at 1 unless you notice
# Folia ownership warnings with large trees.
owned-chunk-radius: 1

# Empty enabled-worlds means all worlds except disabled-worlds are allowed.
enabled-worlds: []
disabled-worlds: []

# Materials that slow regrowth may replace. Solid player blocks are intentionally
# not listed, so queued trees wait instead of eating builds.
replaceable-materials:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - SHORT_GRASS
  - TALL_GRASS
  - FERN
  - LARGE_FERN
  - VINE
  - SNOW

# Log material to Bukkit TreeType mapping. Missing materials or TreeTypes are
# ignored at runtime, which keeps the config friendlier across versions.
tree-types:
  OAK_LOG: TREE
  BIRCH_LOG: BIRCH
  SPRUCE_LOG: REDWOOD
  JUNGLE_LOG: SMALL_JUNGLE
  ACACIA_LOG: ACACIA
  DARK_OAK_LOG: DARK_OAK
  MANGROVE_LOG: MANGROVE
  CHERRY_LOG: CHERRY
  PALE_OAK_LOG: PALE_OAK

# Huge mushroom cap material to Bukkit TreeType mapping. Stems are detected
# automatically by nearby red or brown cap blocks.
mushroom-types:
  RED_MUSHROOM_BLOCK: RED_MUSHROOM
  BROWN_MUSHROOM_BLOCK: BROWN_MUSHROOM

# Nether corruption treats active Nether portals in the Overworld as sources
# of slow terrain change. It does not use a configurable replacement map:
# only internal vanilla-inspired natural block mimics are applied, and blocks
# without a clear Nether equivalent are left alone.
nether-corruption:
  enabled: true
  spread-step-ticks: 1200
  blocks-per-step: 1
  max-radius: 24
  vertical-radius: 8
  attempts-per-step: 24
  required-player-distance-chunks: 8
