# Default: 30 seconds at 20 TPS before the first replacement block appears.
initial-delay-ticks: 600

# testing: visible, fast, noisy growth for development.
# survival: disables feature testing overrides and uses slower world-health pacing.
runtime-profile: testing

# Once regrowth begins, this controls how quickly blocks appear.
# With world-health mode enabled at 0.15x, 135 ticks becomes about 45 seconds.
growth-step-ticks: 135
blocks-per-growth-step: 1

# World health mode slows natural regrowth without changing the normal baseline.
# A growth-speed-multiplier of 0.15 means 15% normal speed.
# With the defaults above, enabled mode grows about 1 block every 45 seconds.
world-health-mode:
  enabled: true
  growth-speed-multiplier: 0.15
  # When enabled, each active plant regrowth gets gradually slower as it places
  # more blocks. With the defaults, a 45 second step can grow toward 90 seconds.
  dynamic-slowdown:
    enabled: true
    delay-growth-per-block: 0.02
    max-delay-multiplier: 2.0

# If a tree cannot regrow because the area is unloaded, too far from players,
# or blocked by another region boundary, it retries later without loading chunks.
retry-delay-ticks: 6000

# 0 means retry forever. Positive values remove the queued tree after that many attempts.
max-regrowth-attempts: 0

# When a lowest trunk/stem anchor is cut, the disconnected natural plant above it
# can decay instead of hanging forever. Default delay: 5 minutes at 20 TPS.
plant-decay:
  enabled: true
  delay-ticks: 6000
  step-ticks: 20
  blocks-per-step: 1
  max-blocks: 128

# Require an online player within this many chunks of the tree base.
# Set to 0 to disable this distance check.
required-player-distance-chunks: 8

# Tree generation can touch neighboring chunks. Keep this at 1 unless you notice
# Folia ownership warnings with large trees.
owned-chunk-radius: 1

# Empty enabled-worlds means all worlds except disabled-worlds are allowed.
enabled-worlds: []
disabled-worlds: []

# Optional WorldGuard support. Regions evolve normally unless explicitly denied:
# /rg flag <region> evolution deny
worldguard:
  enabled: true
  debug-denials: true
  # Query failures allow evolution by default so a WorldGuard problem cannot
  # stall every environmental task. Set false for strict protection.
  fail-open: true

# Writes a high-level trace of how the plugin moves through its own decision
# paths. Use this when a feature is "doing something" but the why is unclear.
architecture-pathfinding:
  debug:
    enabled: true
    recent-events: 500
    save-interval-millis: 10000

# Lightweight in-plugin profiler. It reports which Evolution feature
# tasks cost the most time, which ones spike, and which ones are doing the most
# world/change work. This complements Spark instead of replacing it.
resource-reporter:
  enabled: true
  recent-events: 240
  save-interval-millis: 10000
  slow-sample-millis: 10
  trace-to-architecture-debug: true
  top-task-limit: 50

# Materials that slow regrowth may replace. Solid player blocks are intentionally
# not listed, so queued trees wait instead of eating builds.
replaceable-materials:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - SHORT_GRASS
  - TALL_GRASS
  - FERN
  - LARGE_FERN
  - VINE
  - SNOW

# Log material to Bukkit TreeType mapping. Missing materials or TreeTypes are
# ignored at runtime, which keeps the config friendlier across versions.
tree-types:
  OAK_LOG: TREE
  BIRCH_LOG: BIRCH
  SPRUCE_LOG: REDWOOD
  JUNGLE_LOG: SMALL_JUNGLE
  ACACIA_LOG: ACACIA
  DARK_OAK_LOG: DARK_OAK
  MANGROVE_LOG: MANGROVE
  CHERRY_LOG: CHERRY
  PALE_OAK_LOG: PALE_OAK

# Huge mushroom cap material to Bukkit TreeType mapping. Stems are detected
# automatically by nearby red or brown cap blocks.
mushroom-types:
  RED_MUSHROOM_BLOCK: RED_MUSHROOM
  BROWN_MUSHROOM_BLOCK: BROWN_MUSHROOM

# Meadow growth lets natural surface life slowly spread outward. Dirt near
# existing grass can become grass, grass can grow low/tall plants, and flowers
# appear in small biome-aware clusters. It only touches natural surface blocks,
# loaded chunks, current Folia regions, and nearby-player areas.
meadow-growth:
  enabled: true
  step-ticks: 60
  # 0 means use the server view distance in blocks.
  search-radius: 0
  attempts-per-step: 32
  blocks-per-step: 2
  required-player-distance-chunks: 6
  grass-spread-chance-percent: 75
  plant-grow-chance-percent: 50
  flower-chance-percent: 10
  height-growth-chance-percent: 35
  max-plants-per-area: 30
  replace-leaf-litter: true
  # Fast test mode lets grass, flowers, and forest edges visibly spread while
  # world-health-mode is still enabled globally.
  testing:
    enabled: true
    step-ticks: 10
    attempts-per-step: 128
    blocks-per-step: 8

# Ecology evolution is a gentle, long-term enrichment layer inspired by richer
# biome/worldgen datapacks. It does not copy external assets: it slowly nudges
# existing natural trees taller, adds occasional branches/canopy, and places
# subtle forest-floor detail near loaded, player-visible trees.
ecology-evolution:
  enabled: true
  step-ticks: 120
  # 0 means use the server view distance in blocks.
  search-radius: 0
  attempts-per-step: 32
  blocks-per-step: 1
  required-player-distance-chunks: 6
  height-chance-percent: 42
  branch-chance-percent: 28
  canopy-chance-percent: 50
  forest-floor-chance-percent: 20
  ground-palette-chance-percent: 35
  plant-palette-chance-percent: 70
  rare-feature-chance-percent: 5
  max-details-per-area: 36
  max-tree-height-bonus: 6
  max-branches-near-tree: 6
  # Fast test mode makes biome ecology visible now. Later we can slow this
  # down for survival pacing without changing the ecology rules.
  testing:
    enabled: true
    step-ticks: 20
    attempts-per-step: 128
    blocks-per-step: 8
  debug:
    recent-events: 120
    map-radius: 8

# Tree evolution is the explicit tree DNA system. It observes natural vanilla
# trees near players, stores a seeded growth profile for each tree, and then
# grows trunks, branches, canopy, roots, vines, and forest-floor details one
# block at a time. Optional .nbt, .schem, .schematic, .zip, or .jar files
# placed in plugins/Evolution/structure-scan are analyzed only for
# statistics/debug inspiration; tree configured-feature JSON can also generate
# TreeGrowthProfile suggestions. Those suggestions are saved into
# tree-profile-samples.yml so new tree DNA can pick sampled variation. Exact
# layouts and source JSON are not copied into generated output.
tree-evolution:
  enabled: true
  # 45 seconds at 20 TPS before world-health mode. With 0.15x health mode this
  # becomes about 5 minutes between eligible natural evolution steps per tree.
  step-ticks: 900
  # 0 means use the server view distance in blocks.
  search-radius: 0
  attempts-per-step: 48
  blocks-per-step: 1
  # Fast mode for watching the system work during testing. This bypasses the
  # global world-health slowdown for tree evolution only.
  testing:
    enabled: true
    # Fast but bounded test pacing: visible live growth without making every
    # player tick rewrite the whole nearby forest.
    step-ticks: 5
    min-delay-ticks: 2
    attempts-per-step: 48
    blocks-per-step: 1
    damage-stall-ticks: 20
    stage-acceleration:
      enabled: true
      # ## Testing stage gates. Age increases when this tree places/prunes one
      # block. Placement stays one block at a time so fast testing does not
      # skip the same physical steps survival growth would take.
      small-to-medium-age: 4
      medium-to-mature-age: 12
      mature-to-ancient-age: 36
      allow-any-rarity-ancient: true
      stage-burst-delay-multiplier: 0.04
      breathing-skip-percent: 0
  # 0 means use the scheduled player's visible/search area instead of a second
  # chunk-distance gate.
  required-player-distance-chunks: 0
  owned-chunk-radius: 1
  candidate-cache-millis: 10000
  # Tree DNA is large during testing; debounce saves so growth ticks do not
  # spend most of their time rewriting tree-evolution.yml.
  dna-save-interval-millis: 180000
  dna-cleanup:
    enabled: true
    interval-millis: 60000
    # Removes stale DNA only when the chunk is already loaded/current-region
    # and the stump/base has been missing this long. It will not load chunks.
    missing-base-max-age-millis: 600000
  damage-stall-ticks: 600
  roots:
    enabled: false
  # ## MEDIUM is the fancy-tree form: a visible trunk, real branches, and a cloud-like crown.
  # MATURE and ANCIENT remain available in code but are not entered while this ceiling is active.
  # ## Shape revision 5 requires complete per-tree leaf ownership before pruning or finishing a transition.
  maximum-stage: MEDIUM
  # Huge tree architecture is DNA-driven instead of a simple on/off profile:
  # only rare, landmark, ancient, or scanned giant-like samples can grow 4-8
  # block wide tapered trunks with layered canopy shelves.
  dynamic-slowdown:
    damage-delay-per-hit: 0.12
    max-delay-multiplier: 3.0
  debug:
    enabled: true
    recent-events: 200
    map-radius: 10
    # Writes tree-evolution-3dDebug.yml with stage history, Y-layer slices,
    # and numeric 0-8 voxel grids so planned shape and live growth can be
    # compared 1-for-1. ## Model grid is the tree blueprint; live-status grid is progress.
    3d:
      enabled: true
      recent-stage-events: 80
    # Writes tree-evolution-replay.debug.yml with a sampled provenance report:
    # what the plan expected, what the live block was, and why it can/cannot
    # place there. ## Useful when smoke renders look better than live trees.
    replay:
      enabled: true
      sample-limit: 512
    # When true, startup scans files in plugins/Evolution/structure-scan and
    # refreshes structure-scan-debug.yml without needing /evolution tree scan.
    auto-scan-on-startup: true
  profiles:
    oak:
      target-height-min: 14
      target-height-max: 24
      branches-min: 5
      branches-max: 10
      branch-length-min: 2
      branch-length-max: 7
      canopy-radius: 5
      canopy-density: 0.74
      root-chance: 0.32
      vine-chance: 0.08
      ground-detail-chance: 0.28
    birch:
      target-height-min: 18
      target-height-max: 28
      branches-min: 1
      branches-max: 5
      branch-length-min: 1
      branch-length-max: 3
      canopy-radius: 2
      canopy-density: 0.58
      root-chance: 0.08
      vine-chance: 0.02
      ground-detail-chance: 0.16
    spruce:
      target-height-min: 22
      target-height-max: 38
      branches-min: 6
      branches-max: 14
      branch-length-min: 1
      branch-length-max: 5
      canopy-radius: 4
      canopy-density: 0.68
      root-chance: 0.16
      vine-chance: 0.03
      ground-detail-chance: 0.22
    jungle:
      target-height-min: 30
      target-height-max: 56
      branches-min: 5
      branches-max: 12
      branch-length-min: 2
      branch-length-max: 8
      canopy-radius: 7
      canopy-density: 0.72
      root-chance: 0.28
      vine-chance: 0.34
      ground-detail-chance: 0.30
    acacia:
      target-height-min: 14
      target-height-max: 22
      branches-min: 4
      branches-max: 8
      branch-length-min: 2
      branch-length-max: 7
      canopy-radius: 5
      canopy-density: 0.54
      root-chance: 0.18
      vine-chance: 0.02
      ground-detail-chance: 0.12
    dark_oak:
      target-height-min: 16
      target-height-max: 30
      branches-min: 6
      branches-max: 12
      branch-length-min: 2
      branch-length-max: 7
      canopy-radius: 7
      canopy-density: 0.80
      root-chance: 0.34
      vine-chance: 0.06
      ground-detail-chance: 0.26
    mangrove:
      target-height-min: 18
      target-height-max: 32
      branches-min: 5
      branches-max: 10
      branch-length-min: 2
      branch-length-max: 7
      canopy-radius: 5
      canopy-density: 0.70
      root-chance: 0.45
      vine-chance: 0.20
      ground-detail-chance: 0.20
    cherry:
      target-height-min: 16
      target-height-max: 28
      branches-min: 5
      branches-max: 10
      branch-length-min: 2
      branch-length-max: 6
      canopy-radius: 6
      canopy-density: 0.78
      root-chance: 0.16
      vine-chance: 0.03
      ground-detail-chance: 0.24

# Nether corruption treats active Nether portals in the Overworld as sources
# of slow terrain change. It does not use a configurable replacement map:
# only internal vanilla-inspired natural block mimics are applied, and blocks
# without a clear Nether equivalent are left alone.
nether-corruption:
  enabled: true
  spread-step-ticks: 200
  blocks-per-step: 1
  max-radius: 100
  vertical-radius: 8
  attempts-per-step: 96
  required-player-distance-chunks: 8
  player-portal-scan-radius: 32
  portal-scan-cooldown-millis: 5000
  # When a player movement scan finds no nearby portal, cache that empty result
  # per chunk/radius so we do not rescan the same empty area constantly.
  portal-negative-cache-millis: 30000
  testing:
    enabled: true
    spread-step-ticks: 40
    blocks-per-step: 4
  branching:
    enabled: true
    branch-chance-percent: 85
    branch-radius: 4
    max-frontier-size: 512
  debug:
    recent-events: 40
    map-radius: 24

# Wind is mostly visible through leaves. It spawns subtle falling-leaf motion near
# tree canopies and rarely lets leaves settle into natural, surface-only litter.
wind:
  enabled: true
  gust-tick-interval: 8
  pattern-change-ticks: 6000
  tree-search-radius: 32
  required-player-distance-chunks: 6
  particles:
    clear-count: 16
    rain-count: 8
    storm-count: 24
  weather:
    clear-drift-radius: 10
    rain-drift-radius: 4
    storm-drift-radius: 16
  leaf-litter:
    placement-step-ticks: 80
    placement-attempts: 48
    # Prevents endless leaf carpet buildup. Set to 0 to remove the cap.
    max-per-chunk: 96
  debug:
    recent-events: 40

# Puddles are packet-rendered shallow water during rain. They are visual only:
# no real water blocks are placed, so terrain and builds stay untouched.
# ## Seed, expansion, drying, render, and safety gates write to puddles.debug.yml.
puddles:
  enabled: true
  step-ticks: 20
  radius: 32
  max-puddles-per-world: 300
  required-player-distance-chunks: 6
  growth:
    seed-chance: 0.16
    seed-attempts-per-cycle: 6
    expand-chance: 0.08
    single-puddle-expand-chance: 0.025
    thunderstorm-multiplier: 2.0
    max-expansions-per-cycle: 2
    max-puddle-size: 5
    nearby-puddles-to-merge: 3
    merge-search-radius: 4
    max-depth: 3
  drying:
    start-after-rain-seconds: 5.0
    shrink-chance: 0.18
  render:
    mode: PACKET
    restore-on-disable: true
  testing:
    enabled: true
    step-ticks: 10
    seed-attempts-per-cycle: 10
    max-expansions-per-cycle: 4
  debug:
    recent-events: 80

# Waves are packet-rendered water crests and shoreline run-up. They do not move
# real water blocks. ## Sources begin below sea level and emerge as open directional wave fronts.
waves:
  # ## Sources resolve from a fixed 192-block world lattice and lock to water/shore topology.
  # Players activate nearby loaded sources for Folia safety, but never seed or reposition them.
  enabled: true
  simulation-radius: 120
  render-radius: 100
  update-interval-ticks: 6
  column-step: 1
  # ## Coherent frames prevent staggered scan holes; submerged samples avoid terrain lookup.
  max-columns-per-tick: 20000
  max-block-updates-per-tick-per-player: 26000
  render:
    # ## Batch fake block changes by chunk section instead of sending one packet per cell.
    packed-block-updates: true
    # ## Packet-only water can be overwritten when Minecraft resends a chunk. Reassert
    # a bounded slice of unchanged visuals so movement/view updates cannot erase a wave.
    reassert-interval-ticks: 40
    reassert-budget-per-frame: 1024
  surface-cache:
    # ## Terrain and shore data are stable; longer caching avoids repeated 16-block coast scans.
    ttl-ticks: 600
    max-chunks: 768
    max-water-depth-scan: 8
  smooth-motion:
    # ## Four-tick interpolation lets sub-block front movement change packet-water
    # levels before the crest advances to the next full block.
    enabled: true
    max-update-interval-ticks: 4
  visual-memory:
    sticky-ticks: 8
    crest-lifecycle-ticks: 12
    # ## Four-tick frames ease one packet-water level at a time.
    smoothing: 0.35
  # ## Persistent boomerang fronts use these proportions. Crossing fronts vary their
  # approach angle; giant fronts add a second lower trailing shelf.
  oval-pulses:
    lane-spacing-scale: 0.80
    travel-spacing-scale: 1.25
    width-min-scale: 0.16
    width-max-scale: 0.78
    length-min-scale: 0.20
    length-max-scale: 0.98
    lifecycle-seconds: 22.0
    merge-softness: 1.00
    shore-compression: 0.22
    shore-boost: 0.28
    shallow-water-boost: 0.12
    # ## Strength forms a layered shoulder toward the open leading ridge.
    height-bands:
      edge: 0.20
      shoulder: 0.50
      inner: 0.80
      crest: 1.80
      # ## Values above 0.10 are capped internally for smoother packet-water terraces.
      step: 0.20
  clear:
    amplitude: 0.78
    # ## Speed is blocks per second, not blocks per tick.
    speed: 1.35
    wavelength: 44
    # ## Frequency now controls crest cadence independently from travel speed.
    frequency: 2.20
    height-variation: 0.55
    occurrence: 0.98
    # ## Persistent fronts remain active across long open-water journeys.
    travel-distance: 168
    # ## Distance expiry and shoreline contact control the final fizzle.
    fade-start: 0.62
    fade-power: 0.72
  storm:
    amplitude: 2.10
    # ## Storm waves move faster, but still use blocks per second.
    speed: 2.00
    wavelength: 36
    frequency: 2.35
    height-variation: 0.95
    occurrence: 1.00
    travel-distance: 208
    fade-start: 0.68
    fade-power: 0.62
  # ## Offshore course biases create angled and crossing approaches. Bias fades near
  # land so every complete front converges on and fizzles into the shoreline.
  shoreline-response:
    distance: 16
    fetch-distance: 16
    minimum-facing: 0.20
  shoreline-runup:
    enabled: true
    max-distance: 6
    advance-ticks-per-block: 3
    retreat-ticks-per-block: 5
  particles:
    enabled: true
    budget-per-player: 18
  boats:
    bobbing-enabled: true
    envelope-radius: 3
  worlds-whitelist: []
  # ## Disabled by default so continuous water remains continuous across biome borders.
  # Enable this only when waves must be restricted to the list below.
  biome-filter-enabled: false
  biomes-whitelist:
    - ocean
    - deep_ocean
    - warm_ocean
    - lukewarm_ocean
    - deep_lukewarm_ocean
    - cold_ocean
    - deep_cold_ocean
    - frozen_ocean
    - deep_frozen_ocean
    - river
    - frozen_river
    - swamp
    - mangrove_swamp
    - beach
    - snowy_beach
    - stony_shore
  testing:
    enabled: true
    update-interval-ticks: 6
    simulation-radius: 120
    render-radius: 100
    # ## Testing scans the full 100-block view coherently so moving fronts stay contiguous.
    max-columns-per-tick: 20000
  debug:
    recent-events: 100
